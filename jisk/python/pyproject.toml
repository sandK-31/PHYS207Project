[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jisk"
version = "0.1.0"
description = "Python wrapper for the jisk Julia/CUDA.jl radiative-transfer module"
authors = [{name = "Saahit Mogan", email = "saahitsmogan@gmail.com"}]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "h5py>=3.0",
]

[project.optional-dependencies]
plot   = ["matplotlib>=3.5"]
viz3d  = ["plotly>=5.0"]
all    = ["matplotlib>=3.5", "plotly>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]
